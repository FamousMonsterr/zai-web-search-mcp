name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Syntax and structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax (node --check)
        run: |
          node --check index.js
          node --check client.js
          node --check scripts/install.mjs
          node --check scripts/verify.mjs

      - name: JSON files parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/ru.json','utf8'))"

      - name: No secrets in the tree
        run: |
          ! grep -rInE "(sk-[A-Za-z0-9]{16,}|Bearer [A-Za-z0-9._-]{20,}|ZAI_API_KEY: *[A-Za-z0-9]{20,})" \
            --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.ps1' --include='*.md' .

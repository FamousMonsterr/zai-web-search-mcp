# Mounts the local Host plugin that powers web search and page reading
# through the Z.ai MCP servers (web_search_prime + web_reader), mounts the
# vision MCP bridge, and selects the plugin's providers ("zai-mcp" search,
# "zai-reader" fetch) as the built-in web_search / web_fetch backends in
# place of the DeepSeek search API and the anonymous HTTP fetcher. The plugin
# resolves the ZAI_API_KEY credential stored in the Harness
# ($DSH_HOME/.credentials.yaml), so no secret appears here.
#
# The `web` row override replaces the whole config mapping. To fall back:
# set searchProvider to "deepseek" style backends or fetchProvider to "http".
- insert:
    - id: zai-web-search-mcp
      name: '@local/zai-web-search-mcp'
      config: {}
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: zai-mcp
    fetchProvider: zai-reader
